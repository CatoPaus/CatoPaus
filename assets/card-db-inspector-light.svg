  <rect x="0.75" y="0.75" width="418.5" height="193.5" rx="11.5" fill="none" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="22" y="1" width="90" height="2.5" rx="1" fill="#7C3AED" />

