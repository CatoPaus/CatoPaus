<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 195" width="420" height="195" role="img" aria-label="genkit-turboquant-embedder">
  <defs>
    <linearGradient id="bgTq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#0E1722" />
    </linearGradient>
    <radialGradient id="glowTq" cx="88%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="420" height="195" rx="12" fill="url(#bgTq)" />
  <rect width="420" height="195" rx="12" fill="url(#glowTq)" />
  <rect x="0.75" y="0.75" width="418.5" height="193.5" rx="11.5" fill="none" stroke="#1E293B" stroke-width="1.5" />
  <rect x="22" y="1" width="90" height="2" rx="1" fill="#34D399" />

  <!-- Top Row -->
  <text x="24" y="30" class="mono" font-size="10.5" fill="#34D399" letter-spacing="1.1">RFC // NATIVE C++ VECTOR QUANTIZER</text>
  <!-- Binary Compression Icon -->
  <g transform="translate(362, 18)" fill="none" stroke="#34D399" stroke-width="1.4" opacity="0.85">
    <rect x="0" y="2" width="10" height="10" rx="2" />
    <rect x="14" y="2" width="10" height="10" rx="2" />
    <rect x="0" y="15" width="10" height="10" rx="2" />
    <rect x="14" y="15" width="10" height="10" rx="2" fill="#34D399" fill-opacity="0.25" />
  </g>

  <!-- Title -->
  <text x="24" y="60" class="sans" font-size="19" font-weight="700" fill="#F8FAFC">genkit-turboquant-embedder</text>

  <!-- Description -->
  <text x="24" y="86" class="sans" font-size="12.5" fill="#94A3B8">Firebase Genkit middleware intercepting Float32</text>
  <text x="24" y="104" class="sans" font-size="12.5" fill="#94A3B8">vectors through a native C++ N-API hardware</text>
  <text x="24" y="122" class="sans" font-size="12.5" fill="#94A3B8">binary for 1-bit Polar Quantization (96.8% smaller).</text>

  <!-- Footer Pills -->
