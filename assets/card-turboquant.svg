    <rect x="102" y="0" width="84" height="22" rx="5" fill="#0F172A" stroke="#1E293B" />
    <text x="112" y="14.5" class="mono" font-size="10.5" fill="#F59E0B">C++ N-API</text>

    <rect x="194" y="0" width="128" height="22" rx="5" fill="#0F172A" stroke="#1E293B" />
    <text x="204" y="14.5" class="mono" font-size="10.5" fill="#34D399">-96.8% vector RAM</text>

    <text x="372" y="15.5" text-anchor="end" class="mono" font-size="14" font-weight="600" fill="#94A3B8">↗</text>
